[package]
name = "autosnips-host"
version = "0.3.1"
edition = "2021"
license = "MIT"
build = "build.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Storage_FileSystem"] }
[build-dependencies]
serde_json = "1"
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
